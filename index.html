function showPage(page){if(!titles[page])page='home';document.getElementById('pageTitle').textContent=titles[page];let t=descriptions[page];if(page==='profile'&&user)t+='\nTelegram ID: '+user.user_id;document.getElementById('pageBody').textContent=t;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>showPage(b.dataset.page)));
async function authenticate(){const status=document.getElementById('serverStatus');if(!tg?.initData){status.textContent='Відкрий гру через кнопку Telegram-бота для авторизації.';return}try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),7000);let response;try{response=await fetch(API+'/api/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({init_data:tg.initData}),signal:controller.signal})}finally{clearTimeout(timeout)}if(!response.ok)throw new Error(response.status===403?'Спочатку пройди реєстрацію в Telegram-боті.':'Помилка авторизації (HTTP '+response.status+').');user=await response.json();connected=true;status.textContent='✓ З’єднання із сервером встановлено';}catch(e){authError=e.message||'Сервер недоступний';status.textContent='⚠ '+authError}}
const start=performance.now();function tick(now){const p=Math.min((now-start)/10000,1);document.getElementById('fill').style.width=(p*100).toFixed(1)+'%';document.getElementById('percent').textContent=Math.floor(p*100)+'%';if(p<1){requestAnimationFrame(tick)}else{document.getElementById('loading').hidden=true;document.getElementById('app').hidden=false;showPage('home')}}requestAnimationFrame(tick);authenticate();
</script></body></html>
